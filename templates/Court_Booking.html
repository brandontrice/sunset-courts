{% extends "base.html" %}
{% block content %}

<h1>Court Bookings</h1>

<!-- Add Block Modal -->
<div id="blockModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
     background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:30px; border-radius:8px; width:400px; max-width:90%;">
        <h4>Add Court Block</h4>
        <form id="blockForm">
            <input type="hidden" name="court_id" id="modal_court_id">
            <input type="hidden" name="date" id="modal_date">

            <div style="margin-bottom: 12px;">
                <label>Court</label>
                <input type="text" id="modal_court_display" class="form-control" readonly>
            </div>

            <div style="margin-bottom: 12px;">
                <label>Date</label>
                <input type="text" id="modal_date_display" class="form-control" readonly>
            </div>

            <div style="margin-bottom: 12px;">
                <label>Start Time</label>
                <select name="start_time" id="modal_start_time" class="form-control">
                    {% for slot in time_slots %}
                        <option value="{{ slot }}">{{ slot }}</option>
                    {% endfor %}
                </select>
            </div>
</div>
