{% extends "base.html" %}
{% block content %}

<h2>Book a Court</h2>

<label>Member Phone Number:</label>
<input type="text" id="memberPhone" placeholder="e.g. 5401234567">
<button onclick="lookupMember()">Lookup</button>

<!-- Member info section — hidden until a valid lookup succeeds -->
<div id="memberInfo" style="display:none;">
  <h3>Member Info</h3>
  <p>Name: <span id="memberName"></span></p>
  <p>Email: <span id="memberEmail"></span></p>

  <h3>Schedule a Court</h3>

  <label>Date:</label>
  <input type="date" id="date">

  <label>Court:</label>
  <select id="courtId">
    {% for court in courts %}
      <option value="{{ court.id }}">Court {{ court.court_number }}</option>
    {% endfor %}
  </select>

  <!-- Start/end times locked to :00 and :30 increments only -->
  <label>Start Time:</label>
  <select id="startTime">
    <option value="06:00">06:00</option>
    <option value="06:30">06:30</option>
    <option value="07:00">07:00</option>
    <option value="07:30">07:30</option>
    <option value="08:00">08:00</option>
    <option value="08:30">08:30</option>
    <option value="09:00">09:00</option>
    <option value="09:30">09:30</option>
    <option value="10:00">10:00</option>
    <option value="10:30">10:30</option>
    <option value="11:00">11:00</option>
    <option value="11:30">11:30</option>
    <option value="12:00">12:00</option>
    <option value="12:30">12:30</option>
    <option value="13:00">13:00</option>
    <option value="13:30">13:30</option>
    <option value="14:00">14:00</option>
    <option value="14:30">14:30</option>
    <option value="15:00">15:00</option>
    <option value="15:30">15:30</option>
    <option value="16:00">16:00</option>
    <option value="16:30">16:30</option>
    <option value="17:00">17:00</option>
    <option value="17:30">17:30</option>
    <option value="18:00">18:00</option>
    <option value="18:30">18:30</option>
    <option value="19:00">19:00</option>
    <option value="19:30">19:30</option>
    <option value="20:00">20:00</option>
    <option value="20:30">20:30</option>
    <option value="21:00">21:00</option>
    <option value="21:30">21:30</option>
  </select>

  <label>End Time:</label>
  <select id="endTime">
    <option value="06:30">06:30</option>
    <option value="07:00">07:00</option>
    <option value="07:30">07:30</option>
    <option value="08:00">08:00</option>
    <option value="08:30">08:30</option>
    <option value="09:00">09:00</option>
    <option value="09:30">09:30</option>
    <option value="10:00">10:00</option>
    <option value="10:30">10:30</option>
    <option value="11:00">11:00</option>
    <option value="11:30">11:30</option>
    <option value="12:00">12:00</option>
    <option value="12:30">12:30</option>
    <option value="13:00">13:00</option>
    <option value="13:30">13:30</option>
    <option value="14:00">14:00</option>
    <option value="14:30">14:30</option>
    <option value="15:00">15:00</option>
    <option value="15:30">15:30</option>
    <option value="16:00">16:00</option>
    <option value="16:30">16:30</option>
    <option value="17:00">17:00</option>
    <option value="17:30">17:30</option>
    <option value="18:00">18:00</option>
    <option value="18:30">18:30</option>
    <option value="19:00">19:00</option>
    <option value="19:30">19:30</option>
    <option value="20:00">20:00</option>
    <option value="20:30">20:30</option>
    <option value="21:00">21:00</option>
    <option value="21:30">21:30</option>
    <option value="22:00">22:00</option>
  </select>

  <!-- Guest section — dynamically add/remove guest rows -->
  <h3>Guests</h3>
  <div id="guestContainer"></div>
  <button type="button" onclick="addGuest()">➕ Add Guest</button>

  <br><br>
  <button onclick="scheduleBooking()">Book Court</button>
  <p id="bookingMessage"></p>
</div>

<script>
  let resolvedMemberId = null;

  // ── Set date picker bounds to current year on page load ──────────────────
  (function () {
    const today = new Date();
    const year  = today.getFullYear();
    const todayStr = today.toISOString().split('T')[0];
    const picker = document.getElementById('date');
    picker.min = todayStr;               // can't book in the past
    picker.max = `${year}-12-31`;        // can't book beyond this year
    picker.value = todayStr;             // default to today
  })();

  // ── Phone number lookup ───────────────────────────────────────────────────
  async function lookupMember() {
    const phone = document.getElementById('memberPhone').value.trim();
    if (!phone) {
      alert('Please enter a phone number.');
      return;
    }

    const res  = await fetch(`/member/by-phone/${phone}`);
    const data = await res.json();

    if (data.error) {
      document.getElementById('memberInfo').style.display = 'none';
      alert(data.error);
      return;
    }

    resolvedMemberId = data.id;
    document.getElementById('memberName').textContent  = data.name;
    document.getElementById('memberEmail').textContent = data.email || 'N/A';
    document.getElementById('memberInfo').style.display = 'block';
  }

  // ── Book court ────────────────────────────────────────────────────────────
  async function scheduleBooking() {
    const courtId   = document.getElementById('courtId').value;
    const date      = document.getElementById('date').value;
    const startTime = document.getElementById('startTime').value;
    const endTime   = document.getElementById('endTime').value;
    const msgEl     = document.getElementById('bookingMessage');

    // Client-side date validation (backend also enforces this)
    if (!date) {
      msgEl.style.color = 'red';
      msgEl.textContent = 'Please select a date.';
      return;
    }

    const today = new Date().toISOString().split('T')[0];
    if (date < today) {
      msgEl.style.color = 'red';
      msgEl.textContent = 'Cannot book a date in the past.';
      return;
    }

    if (startTime >= endTime) {
      msgEl.style.color = 'red';
      msgEl.textContent = 'End time must be after start time.';
      return;
    }

    // Collect all guest rows from the dynamic container
    const guests = [...document.querySelectorAll('.guest-row')].map(row => ({
      first_name: row.querySelector('.guestFirst').value.trim(),
      last_name:  row.querySelector('.guestLast').value.trim(),
      phone:      row.querySelector('.guestPhone').value.trim()
    }));

    const hasGuest = guests.length > 0;

    const res = await fetch('/bookings/add', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        member_id:  resolvedMemberId,
        court_id:   courtId,
        date:       date,
        start_time: startTime,
        end_time:   endTime,
        has_guest:  hasGuest,
        guests:     guests
      })
    });

    const result = await res.json();

    if (result.success) {
      msgEl.style.color = 'green';
      msgEl.textContent = 'Booking confirmed!';
      // Clear guests after successful booking
      document.getElementById('guestContainer').innerHTML = '';
    } else {
      msgEl.style.color = 'red';
      msgEl.textContent = result.error || 'Booking failed.';
    }
  }

  // ── Dynamic guest rows ────────────────────────────────────────────────────
  function addGuest() {
    const container = document.getElementById('guestContainer');
    const div = document.createElement('div');
    div.classList.add('guest-row');
    div.style.marginBottom = '8px';
    div.innerHTML = `
      <input type="text" placeholder="First Name" class="guestFirst">
      <input type="text" placeholder="Last Name"  class="guestLast">
      <input type="text" placeholder="Phone Number" class="guestPhone">
      <button type="button" onclick="this.parentElement.remove()">❌</button>
    `;
    container.appendChild(div);
  }
</script>

{% endblock %}
