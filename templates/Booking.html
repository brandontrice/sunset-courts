{% extends "base.html" %}
{% block content %}

<!DOCTYPE html>
<html>
<h1><title>Court Scheduler</title></h1>

  <body>

    <h2>Court Scheduling System</h2>

  <label>Member ID:</label>
  <input type="text" id="memberId">
  <button onclick="lookupMember()">Lookup</button>

  <h3>Member Info</h3>
  <p>Name: <span id="name"></span></p>
  <p>Email: <span id="email"></span></p>

  <h3>Schedule Court Date</h3>
  <input type="date" id="date">
  <input type="time" id="time">
  <button onclick="schedule()">Schedule</button>

  <script>
    async function lookupMember() {
      const id = document.getElementById("memberId").value;

    const res = await fetch(`/member/${id}`);
    const data = await res.json();

    document.getElementById("name").textContent = data.name || "Not found";
    document.getElementById("email").textContent = data.email || "";
  }

  async function schedule() {
    const memberId = document.getElementById("memberId").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    await fetch("/schedule", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ memberId, date, time })
    });

    alert("Court date scheduled!");
  }
  </script>

</body>
</html>
