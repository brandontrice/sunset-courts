{% extends "base.html" %}
{% block content %}

<h2>Book a Court</h2>

<label>Member's Phone Number:</label>
<input type="text" id="memberId">
<button onclick="lookupMember()">Lookup</button>

<!-- Member info section is hidden until a valid member is found via lookup -->
<div id="memberInfo" style="display:none;">
  <h3>Member Info</h3>
  <p>Name: <span id="name"></span></p>
  <p>Email: <span id="email"></span></p>

  <h3>Schedule a Court</h3>
  <label>Date:</label>
  <input type="date" id="date" min="01-01-2026" max="31-12-2026">

  <!-- Court dropdown populated by Flask from the /booking route -->
  <label>Court:</label>
  <select id="courtId">
    {% for court in courts %}
      <option value="{{ court.id }}">Court {{ court.court_number }}</option>
    {% endfor %}
  </select>

  <!-- Both time selects are fully hardcoded here in the template.
       Only :00 and :30 values exist as options — there is no way to pick anything else.
       Start runs 06:00–21:30. End runs 06:30–22:00. -->
  <label>Start Time:</label>
  <select id="startTime">
    <option value="06:00">06:00</option>
    <option value="06:30">06:30</option>
    <option value="07:00">07:00</option>
    <option value="07:30">07:30</option>
    <option value="08:00">08:00</option>
    <option value="08:30">08:30</option>
    <option value="09:00">09:00</option>
    <option value="09:30">09:30</option>
    <option value="10:00">10:00</option>
    <option value="10:30">10:30</option>
    <option value="11:00">11:00</option>
    <option value="11:30">11:30</option>
    <option value="12:00">12:00</option>
    <option value="12:30">12:30</option>
    <option value="13:00">13:00</option>
    <option value="13:30">13:30</option>
    <option value="14:00">14:00</option>
    <option value="14:30">14:30</option>
    <option value="15:00">15:00</option>
    <option value="15:30">15:30</option>
    <option value="16:00">16:00</option>
    <option value="16:30">16:30</option>
    <option value="17:00">17:00</option>
    <option value="17:30">17:30</option>
    <option value="18:00">18:00</option>
    <option value="18:30">18:30</option>
    <option value="19:00">19:00</option>
    <option value="19:30">19:30</option>
    <option value="20:00">20:00</option>
    <option value="20:30">20:30</option>
    <option value="21:00">21:00</option>
    <option value="21:30">21:30</option>
  </select>

  <label>End Time:</label>
  <select id="endTime">
    <option value="06:30">06:30</option>
    <option value="07:00">07:00</option>
    <option value="07:30">07:30</option>
    <option value="08:00">08:00</option>
    <option value="08:30">08:30</option>
    <option value="09:00">09:00</option>
    <option value="09:30">09:30</option>
    <option value="10:00">10:00</option>
    <option value="10:30">10:30</option>
    <option value="11:00">11:00</option>
    <option value="11:30">11:30</option>
    <option value="12:00">12:00</option>
    <option value="12:30">12:30</option>
    <option value="13:00">13:00</option>
    <option value="13:30">13:30</option>
    <option value="14:00">14:00</option>
    <option value="14:30">14:30</option>
    <option value="15:00">15:00</option>
    <option value="15:30">15:30</option>
    <option value="16:00">16:00</option>
    <option value="16:30">16:30</option>
    <option value="17:00">17:00</option>
    <option value="17:30">17:30</option>
    <option value="18:00">18:00</option>
    <option value="18:30">18:30</option>
    <option value="19:00">19:00</option>
    <option value="19:30">19:30</option>
    <option value="20:00">20:00</option>
    <option value="20:30">20:30</option>
    <option value="21:00">21:00</option>
    <option value="21:30">21:30</option>
    <option value="22:00">22:00</option>
  </select>

  <!-- Optional guest flag — maps to has_guest on the Booking model -->
  <label>
    <input type="checkbox" id="hasGuest" onclick="ShowGuest()"> Bringing a guest?
  </label>

  <!-- Guest info section — shown/hidden by ShowGuest() -->
  <h3>Guests</h3>
  <div id="guestContainer"></div>

    <button type="button" onclick="addGuest()">➕ Add Guest</button>
  <div\>

  <br><br>
  <button onclick="scheduleBooking()">Book Court</button>
  <p id="bookingMessage"></p>
</div>

<script>
  let resolvedMemberId = null;

  async function lookupMember() {
    const id = document.getElementById('membnumber').value.trim();
    if (!id) return;

    const res  = await fetch(`/member/${phone}`);
    const data = await res.json();

    if (data.error) {
      document.getElementById('memberInfo').style.display = 'none';
      alert(data.error);
      return;
    }

    resolvedMemberId = data.id;
    document.getElementById('name').textContent  = data.name;
    document.getElementById('email').textContent = data.email || 'N/A';
    document.getElementById('memberInfo').style.display = 'block';
  }

  async function scheduleBooking() {
    const courtId          = document.getElementById('courtId').value;
    const date             = document.getElementById('date').value;
    const startTime        = document.getElementById('startTime').value;
    const endTime          = document.getElementById('endTime').value;
    const hasGuest         = document.getElementById('hasGuest').checked;
    const guestname        = document.getElementByID('guestname').value;
    const guestphonenumber = document.getElementByID('guestphonenumber').value;
    const msgEl            = document.getElementById('bookingMessage');

    if (!date) {
      msgEl.textContent = 'Please select a date.';
      return;
    }

    if (startTime >= endTime) {
      msgEl.style.color = 'red';
      msgEl.textContent = 'End time must be after start time.';
      return;
    }

    const res = await fetch('/bookings/add', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        member_id:          resolvedMemberId,
        court_id:           courtId,
        date:               date,
        start_time:         startTime,
        end_time:           endTime,
        has_guest:          hasGuest,
        Guest_Name:         guestname,
        Guest_Phone_Number: guestphonenumber,
      })
    });

    const data = await res.json();

    if (data.success) {
      msgEl.style.color = 'green';
      msgEl.textContent = 'Booking confirmed!';
    } else {
      msgEl.style.color = 'red';
      msgEl.textContent = data.error || 'Booking failed.';
    }
  }

  function addGuest() {
  const container = document.getElementById("guestContainer");

  const div = document.createElement("div");
  div.classList.add("guest");

  div.innerHTML = `
    <input type="text" placeholder="First Name" class="guestFirst">
    <input type="text" placeholder="Last Name" class="guestLast">
    <input type="text" placeholder="Phone Number" class="guestPhone">
    <button type="button" onclick="this.parentElement.remove()">❌</button>
    <br><br>
  `;

  container.appendChild(div);
}
  
  function ShowGuest() {
    const checkbox = document.getElementById('hasGuest');
    document.getElementById('GuestInfo').style.display = checkbox.checked ? 'block' : 'none';
  }
</script>

{% endblock %}
