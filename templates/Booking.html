{% extends "base.html" %}
{% block content %}

<h2>Book a Court</h2>

<label>Member ID:</label>
<input type="text" id="memberId">
<button onclick="lookupMember()">Lookup</button>

<!-- Member info section is hidden until a valid member is found via lookup -->
<div id="memberInfo" style="display:none;">
  <h3>Member Info</h3>
  <p>Name: <span id="name"></span></p>
  <p>Email: <span id="email"></span></p>

  <h3>Schedule a Court</h3>
  <label>Date:</label>
  <input type="date" id="date" min="2026-01-01" max="2026-12-31">

  <!-- Court dropdown is populated by Flask passing the courts list from the /booking route -->
  <label>Court:</label>
  <select id="courtId">
    {% for court in courts %}
      <option value="{{ court.id }}">Court {{ court.court_number }}</option>
    {% endfor %}
  </select>

  <!-- step="1800" restricts time picker to 30-minute increments (1800 seconds) -->
  <label>Start Time:</label>
  <input type="time" id="startTime" step="1800">

  <label>End Time:</label>
  <input type="time" id="endTime" step="1800">

  <!-- Optional guest flag — maps to has_guest on the Booking model -->
  <label>
    <input type="checkbox" id="hasGuest" onclick="ShowGuest()"> Bringing a guest?
  </label>

  <!-- Guest info input section is hidden until hasGuest is checked -->
  <div id="GuestInfo" style="display:none;"></div>
  <div id="GuestInfo">
    <h3>Guest Info</h3>
    <label> Guest Name</label>
    <input type="Name" id="GuestName">
    <br><br>
    <label> Guest Phone Number</label>
    <input type="PhoneNumber" id="GuestPhoneNumber">
    <div id="GuestInfo" style="display:none;"></div>
</div>
 
  <br><br>
  <button onclick="scheduleBooking()">Book Court</button>
  <!-- Booking result message displayed here instead of using alert() -->
  <p id="bookingMessage"></p>


<script>
  // Stores the resolved member ID after a successful lookup
  let resolvedMemberId = null;

  async function lookupMember() {
    const id = document.getElementById("memberId").value.trim();
    if (!id) return;

    // Calls the /member/<id> route in app.py to validate the member
    const res = await fetch(`/member/${id}`);
    const data = await res.json();

    // If the member is invalid, banned, or inactive, hide the form and alert
    if (data.error) {
      document.getElementById("memberInfo").style.display = "none";
      alert(data.error);
      return;
    }

    // Store the member ID so it can be sent with the booking request
    resolvedMemberId = data.id;
    document.getElementById("name").textContent = data.name;
    document.getElementById("email").textContent = data.email || "N/A";

    // Reveal the booking form now that a valid member is confirmed
    document.getElementById("memberInfo").style.display = "block";
  }

  async function scheduleBooking() {
    const courtId = document.getElementById("courtId").value;
    const date = document.getElementById("date").value;
    const startTime = document.getElementById("startTime").value;
    const endTime = document.getElementById("endTime").value;
    const hasGuest = document.getElementById("hasGuest").checked;
    const msgEl = document.getElementById("bookingMessage");

    // Basic client-side validation before hitting the server
    if (!date || !startTime || !endTime) {
      msgEl.textContent = "Please fill in all fields.";
      return;
    }

    // Prevent end time from being the same as or before start time
    if (startTime >= endTime) {
      msgEl.textContent = "End time must be after start time.";
      return;
    }

    // POST to /bookings/add in app.py which handles conflict checking and saving
    const res = await fetch("/bookings/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        member_id: resolvedMemberId,
        court_id: courtId,
        date: date,
        start_time: startTime,
        end_time: endTime,
        has_guest: hasGuest
      })
    });

    const data = await res.json();

    // Display success or error message returned from the server
    if (data.success) {
      msgEl.style.color = "green";
      msgEl.textContent = "Booking confirmed!";
    } else {
      msgEl.style.color = "red";
      msgEl.textContent = data.error || "Booking failed.";
    }
  }
   // Hides the Guest Section and show it when the guest button is clicked
   function ShowGuest() {
    const section = document.getElementById("GuestInfo");
    const checkbox = document.getElementById("hasGuest");

  if (checkbox.checked) {
    section.style.display = "block";
  } else {
    section.style.display = "none";
  }
}

</script>

{% endblock %}
