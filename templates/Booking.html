{% extends "base.html" %}
{% block content %}

<h2>Book a Court</h2>

<label>Member ID:</label>
<input type="text" id="memberId">
<button onclick="lookupMember()">Lookup</button>

<!-- Member info section is hidden until a valid member is found via lookup -->
<div id="memberInfo" style="display:none;">
  <h3>Member Info</h3>
  <p>Name: <span id="name"></span></p>
  <p>Email: <span id="email"></span></p>

  <h3>Schedule a Court</h3>
  <label>Date:</label>
  <input type="date" id="date" min="2026-01-01" max="2026-12-31">

  <!-- Court dropdown is populated by Flask passing the courts list from the /booking route -->
  <label>Court:</label>
  <select id="courtId">
    {% for court in courts %}
      <option value="{{ court.id }}">Court {{ court.court_number }}</option>
    {% endfor %}
  </select>

  <!-- Start and end time dropdowns are built in JS at 30-minute increments only.
       Using a select instead of type="time" because browsers don't reliably
       enforce step="1800" — users can still type arbitrary minutes in some browsers. -->
  <label>Start Time:</label>
  <select id="startTime" onchange="updateEndTimes()"></select>

  <label>End Time:</label>
  <select id="endTime"></select>

  <!-- Optional guest flag — maps to has_guest on the Booking model -->
  <label>
    <input type="checkbox" id="hasGuest" onclick="ShowGuest()"> Bringing a guest?
  </label>

  <!-- Guest info section — shown/hidden by ShowGuest() -->
  <div id="GuestInfo" style="display:none;">
    <h3>Guest Info</h3>
    <label>Guest Name</label>
    <input type="text" id="GuestName">
    <br><br>
    <label>Guest Phone Number</label>
    <input type="text" id="GuestPhoneNumber">
  </div>

  <br><br>
  <button onclick="scheduleBooking()">Book Court</button>
  <!-- Booking result message displayed here instead of using alert() -->
  <p id="bookingMessage"></p>
</div>

<script>
  // Stores the resolved member ID after a successful lookup
  let resolvedMemberId = null;

  // Build the list of 30-minute time slots from 06:00 to 22:00 (matches calendar)
  function buildTimeSlots() {
    const slots = [];
    for (let h = 6; h < 22; h++) {
      slots.push(`${String(h).padStart(2,'0')}:00`);
      slots.push(`${String(h).padStart(2,'0')}:30`);
    }
    slots.push('22:00');
    return slots;
  }

  const allSlots = buildTimeSlots();

  function populateStartTimes() {
    const startSel = document.getElementById('startTime');
    startSel.innerHTML = '';
    // Exclude 22:00 as a start time — a booking must end by 22:00, not start there
    allSlots.slice(0, -1).forEach(slot => {
      const opt = document.createElement('option');
      opt.value = slot;
      opt.textContent = slot;
      startSel.appendChild(opt);
    });
    updateEndTimes();
  }

  // End time dropdown only shows slots after the selected start time
  function updateEndTimes() {
    const startVal = document.getElementById('startTime').value;
    const endSel   = document.getElementById('endTime');
    const startIdx = allSlots.indexOf(startVal);
    endSel.innerHTML = '';
    // Offer only slots ahead of start (minimum 30-minute booking enforced here)
    allSlots.slice(startIdx + 1).forEach(slot => {
      const opt = document.createElement('option');
      opt.value = slot;
      opt.textContent = slot;
      endSel.appendChild(opt);
    });
  }

  populateStartTimes();

  async function lookupMember() {
    const id = document.getElementById("memberId").value.trim();
    if (!id) return;

    const res  = await fetch(`/member/${id}`);
    const data = await res.json();

    if (data.error) {
      document.getElementById("memberInfo").style.display = "none";
      alert(data.error);
      return;
    }

    resolvedMemberId = data.id;
    document.getElementById("name").textContent  = data.name;
    document.getElementById("email").textContent = data.email || "N/A";
    document.getElementById("memberInfo").style.display = "block";
  }

  async function scheduleBooking() {
    const courtId   = document.getElementById("courtId").value;
    const date      = document.getElementById("date").value;
    const startTime = document.getElementById("startTime").value;
    const endTime   = document.getElementById("endTime").value;
    const hasGuest  = document.getElementById("hasGuest").checked;
    const msgEl     = document.getElementById("bookingMessage");

    if (!date || !startTime || !endTime) {
      msgEl.textContent = "Please fill in all fields.";
      return;
    }

    // Safeguard — shouldn't be reachable with select dropdowns but kept defensively
    if (startTime >= endTime) {
      msgEl.textContent = "End time must be after start time.";
      return;
    }

    const res = await fetch("/bookings/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        member_id:  resolvedMemberId,
        court_id:   courtId,
        date:       date,
        start_time: startTime,
        end_time:   endTime,
        has_guest:  hasGuest
      })
    });

    const data = await res.json();

    if (data.success) {
      msgEl.style.color = "green";
      msgEl.textContent = "Booking confirmed!";
    } else {
      msgEl.style.color = "red";
      msgEl.textContent = data.error || "Booking failed.";
    }
  }

  function ShowGuest() {
    const section  = document.getElementById("GuestInfo");
    const checkbox = document.getElementById("hasGuest");
    section.style.display = checkbox.checked ? "block" : "none";
  }
</script>

{% endblock %}
